    <!-- Cấu hình chuẩn PWA cho iOS và Mobile -->
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // Chuyển hướng link GitHub Pages cũ về domain mới
      if (window.location.hostname.includes("github.io")) {
        window.location.replace("https://chuhedayne.vercel.app/spin");
      }
